<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola Inovação - Aprendendo Tecnologia</title>
  <style>
    :root {
      --primary-color: #0B7A53;
      --secondary-color: #24B47E;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 3rem 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    main {
      padding: 2rem;
    }
    main p {
      font-size: 1.2rem;
      color: #555;
    }
    footer {
      background-color: #222;
      color: white;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindos à nossa escola!</h1>
    <p>Construindo o futuro através da educação e da tecnologia.</p>
  </header>
  
  <main>
    <h2>Sobre o Curso</h2>
    <p>Aprendendo desenvolvimento de sistemas, lógica de programação e tecnologia na prática.</p>
  </main>

  <footer>
    <p>&copy; 2026 Escola Inovação. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
